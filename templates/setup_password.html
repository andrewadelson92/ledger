{% extends "auth_base.html" %}
{% block title %}Create password · Ledger{% endblock %}
{% block content %}
<section class="rounded-lg border border-zinc-200 bg-white p-6">
  <h2 class="text-base font-semibold">Create your password</h2>
  <p class="mt-1 text-sm text-zinc-600">For accounts created before sign-in was enabled. Use the email already on your account.</p>
  <form method="post" action="{{ url_for('setup_password') }}" class="mt-4 space-y-4" autocomplete="off">
    <div>
      <label class="block text-sm font-medium text-zinc-900">Email</label>
      <input type="email" name="email" required autofocus
        value="andrew.adelson92@gmail.com"
        class="mt-1 w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-zinc-400 focus:ring-2 focus:ring-zinc-200" />
    </div>
    <div>
      <label class="block text-sm font-medium text-zinc-900">Password</label>
      <input type="password" name="password" required minlength="8"
        class="mt-1 w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-zinc-400 focus:ring-2 focus:ring-zinc-200" />
    </div>
    <div>
      <label class="block text-sm font-medium text-zinc-900">Confirm password</label>
      <input type="password" name="password_confirm" required minlength="8"
        class="mt-1 w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-zinc-400 focus:ring-2 focus:ring-zinc-200" />
    </div>
    <button type="submit"
      class="inline-flex w-full items-center justify-center rounded-md bg-zinc-900 px-3 py-2 text-sm font-medium text-white hover:bg-zinc-800">
      Save password and sign in
    </button>
  </form>
  <p class="mt-4 text-center text-sm text-zinc-600">
    Already have a password?
    <a href="{{ url_for('login') }}" class="font-medium text-zinc-900 underline">Sign in</a>
  </p>
</section>
{% endblock %}
