{% extends "auth_base.html" %}
{% block title %}Create account · Ledger{% endblock %}
{% block content %}
<section class="rounded-lg border border-zinc-200 bg-white p-6">
  <h2 class="text-base font-semibold">Create account</h2>
  <p class="mt-1 text-sm text-zinc-600">You were invited to Ledger. Set a password for <strong class="font-medium">{{ invite_email }}</strong>.</p>
  <form method="post" action="{{ url_for('register', token=token) }}" class="mt-4 space-y-4" autocomplete="off">
    <div>
      <label class="block text-sm font-medium text-zinc-900">Password</label>
      <input type="password" name="password" required minlength="8"
        class="mt-1 w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-zinc-400 focus:ring-2 focus:ring-zinc-200" />
    </div>
    <div>
      <label class="block text-sm font-medium text-zinc-900">Confirm password</label>
      <input type="password" name="password_confirm" required minlength="8"
        class="mt-1 w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-zinc-400 focus:ring-2 focus:ring-zinc-200" />
    </div>
    <button type="submit"
      class="inline-flex w-full items-center justify-center rounded-md bg-zinc-900 px-3 py-2 text-sm font-medium text-white hover:bg-zinc-800">
      Create account
    </button>
  </form>
</section>
{% endblock %}
