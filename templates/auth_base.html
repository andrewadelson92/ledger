<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledger{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 text-zinc-900">
  <main class="mx-auto max-w-md px-4 py-16">
    <div class="mb-8 text-center">
      <img src="{{ url_for('static', filename='logo.png') }}" alt=""
        class="mx-auto h-12 w-12 object-contain" width="48" height="48">
      <h1 class="mt-3 text-xl font-semibold">Ledger</h1>
      <p class="mt-1 text-sm text-zinc-600">A calm practice log</p>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 rounded-md border border-zinc-200 bg-white px-4 py-3 text-sm text-zinc-800">
          {% for m in messages %}{{ m }}{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
